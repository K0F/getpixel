Auto Name: Pixel Magnifier
Name:
  en: Pixel Magnifier
Summary: Camera colour picker with lighting calibration and CIE L*u*v*
Description: |
  A colour picker that uses the camera: point at any object and read its
  R G B values, #RRGGBB, CIE XYZ and CIE L*u*v* for the current lighting.
  A live crosshair follows the finger over the full preview; a tap stores
  the picked colour into an on-device gallery with EXIF details.

  The Cal chip builds a per-patch calibration against a ColorChecker (white
  balance gains with a few taps, a full 3x3 linear-RGB matrix with several)
  for profile-accurate colours. The Light chip switches the white point
  between standard illuminants (D65, D50, A) and your own light source; the
  RAW/CAL toggle keeps the uncalibrated capture too. The gallery exports
  corrected colours and a per-colour report.

  Small, offline, no network permissions. This is the graphical companion to
  the project's get_pixel CLI.

