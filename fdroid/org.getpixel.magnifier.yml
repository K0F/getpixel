Auto Name: Pixel Magnifier
Name:
  en: Pixel Magnifier
Summary: On-screen pixel magnifier with colour readout
Description: |
  A floating magnifying-glass overlay that lets you target any pixel on the
  screen. Drag the glass to move it, pinch to zoom (1–12×); a crosshair marks
  the pixel under the glass centre and a live readout shows its RGBA values
  and #RRGGBB. A long-press copies the hex value to the clipboard.

  Uses MediaProjection for capture, so it also works alongside non-rooted
  devices; a foreground service (required by Android 14+) keeps the capture
  alive while the glass floats over other apps.

  This is the graphical companion to the project's get_pixel CLI, which reads
  single pixels over an adb shell.

