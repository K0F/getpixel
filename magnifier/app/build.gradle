plugins {
    id 'com.android.application'
}

android {
    namespace 'org.getpixel.magnifier'
    compileSdk 34

    defaultConfig {
        applicationId "org.getpixel.magnifier"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            // F-Droid signs with its own key, so we ship unsigned deterministically.
            signingConfig null
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    signingConfigs {
        debug {
            // Pin the debug key so `adb install -r` upgrades keep matching signatures.
            def debugKS = System.getenv("ANDROID_USER_HOME")
                    ? new File(System.getenv("ANDROID_USER_HOME"), "debug.keystore")
                    : new File(System.getProperty("user.home"), ".config/.android/debug.keystore")
            storeFile debugKS.exists() ? debugKS : new File(System.getProperty("user.home"), ".android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // MediaProjection APIs are intentionally used across API levels.
        disable 'IconMissingDensityFolder', 'AllowBackup'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

android {
    testOptions {
        unitTests.returnDefaultValues = true
    }
}